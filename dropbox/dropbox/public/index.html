<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dropbox File Storage - Model Lab</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      margin: 20px;
      background-color: #ffffff;
      color: #000000;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #000000;
      padding: 6px 10px;
      text-align: left;
    }
    th {
      background-color: #e0e0e0;
    }
    fieldset {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #000000;
    }
    legend {
      font-weight: bold;
    }
    .status-box {
      border: 1px dashed #333;
      padding: 8px;
      margin-bottom: 15px;
      background-color: #f9f9f9;
    }
    #msg {
      margin: 10px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Dropbox Cloud Storage Manager (Lab Experiment)</h1>
  <hr>

  <div class="status-box">
    <strong>API Status:</strong> <span id="status-text">Checking status...</span>
  </div>

  <div id="msg"></div>

  <fieldset>
    <legend>Upload File to Dropbox</legend>
    <form id="upload-form" onsubmit="event.preventDefault(); uploadFile();">
      <label for="file-input">Select File: </label>
      <input type="file" id="file-input" required>
      <br><br>
      <input type="submit" id="upload-btn" value="Upload File">
      <input type="reset" value="Clear">
    </form>
  </fieldset>

  <fieldset>
    <legend>Dropbox File Explorer</legend>
    <button type="button" onclick="loadFiles()">Refresh File List</button>
    <br><br>

    <table id="files-table">
      <thead>
        <tr>
          <th>S.No</th>
          <th>File Name</th>
          <th>File Size</th>
          <th>Last Modified</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="files-tbody">
        <tr>
          <td colspan="5">Loading files from Dropbox...</td>
        </tr>
      </tbody>
    </table>
  </fieldset>

  <script>
    function showMessage(text, isError) {
      const msgDiv = document.getElementById("msg");
      msgDiv.textContent = text;
      msgDiv.style.color = isError ? "red" : "green";
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return "0 Bytes";
      const k = 1024;
      const sizes = ["Bytes", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
    }

    async function checkStatus() {
      const statusText = document.getElementById("status-text");
      try {
        const res = await fetch("/api/status");
        const data = await res.json();

        if (res.ok && data.connected) {
          statusText.innerHTML = '<span style="color: green; font-weight: bold;">CONNECTED</span> &mdash; ' + data.user + ' (' + data.email + ')';
        } else {
          statusText.innerHTML = '<span style="color: red; font-weight: bold;">NOT CONNECTED / ERROR</span> &mdash; ' + (data.error || "Token Invalid");
          showMessage("Error connecting to Dropbox: " + (data.error || "Check your credentials"), true);
        }
      } catch (err) {
        statusText.innerHTML = '<span style="color: red; font-weight: bold;">SERVER OFFLINE</span>';
      }
    }

    async function uploadFile() {
      const input = document.getElementById("file-input");
      if (!input.files || input.files.length === 0) {
        alert("Please select a file first.");
        return;
      }

      const uploadBtn = document.getElementById("upload-btn");
      uploadBtn.disabled = true;
      uploadBtn.value = "Uploading...";
      showMessage("Uploading file, please wait...", false);

      const formData = new FormData();
      formData.append("file", input.files[0]);

      try {
        const res = await fetch("/upload", {
          method: "POST",
          body: formData
        });

        const data = await res.json();
        if (res.ok && data.success) {
          showMessage(data.message || "File uploaded successfully!", false);
          input.value = "";
          loadFiles();
        } else {
          showMessage("Upload failed: " + (data.error || "Unknown error"), true);
          alert("Upload failed: " + (data.error || "Unknown error"));
        }
      } catch (err) {
        showMessage("Upload request error: " + err.message, true);
        alert("Upload error: " + err.message);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.value = "Upload File";
      }
    }

    async function loadFiles() {
      const tbody = document.getElementById("files-tbody");
      tbody.innerHTML = '<tr><td colspan="5">Fetching files from Dropbox...</td></tr>';

      try {
        const res = await fetch("/files");
        const files = await res.json();

        if (!res.ok || files.error) {
          let errorText = files.error || "Could not fetch files. Check Dropbox permissions.";
          let hint = "";
          if (errorText.includes("files.metadata.read") || errorText.includes("scope") || errorText.includes("permitted")) {
            hint = `<div style="margin-top: 8px; color: #856404; background-color: #fff3cd; border: 1px solid #ffeeba; padding: 8px;">
              <strong>Action Required:</strong> In the <a href="https://www.dropbox.com/developers/apps" target="_blank">Dropbox App Console</a> for your app:
              <ol style="margin: 5px 0 5px 20px;">
                <li>Go to the <b>Permissions</b> tab.</li>
                <li>Check <code>files.metadata.read</code>, <code>files.content.read</code>, and <code>files.content.write</code>.</li>
                <li>Click <b>Submit</b>.</li>
                <li>Go to the <b>Settings</b> tab, click <b>Generate</b> under "Generated access token", and paste it into <code>.env</code>.</li>
              </ol>
            </div>`;
          }
          tbody.innerHTML = '<tr><td colspan="5" style="color: red;">Error: ' + errorText + hint + '</td></tr>';
          return;
        }

        if (!files.length) {
          tbody.innerHTML = '<tr><td colspan="5">No files found in Dropbox folder.</td></tr>';
          return;
        }

        tbody.innerHTML = "";
        files.forEach((file, index) => {
          const downloadUrl = "/download?path=" + encodeURIComponent(file.path);
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td>${index + 1}</td>
            <td><strong>${file.name}</strong></td>
            <td>${formatBytes(file.size)}</td>
            <td>${new Date(file.modified).toLocaleString()}</td>
            <td>
              <a href="${downloadUrl}" target="_blank">[View]</a> &nbsp;|&nbsp;
              <a href="${downloadUrl}&download=1">[Download]</a> &nbsp;|&nbsp;
              <button type="button" onclick="deleteFile('${file.path.replace(/'/g, "\\'")}')">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" style="color: red;">Error loading files: ' + err.message + '</td></tr>';
      }
    }

    async function deleteFile(path) {
      if (!confirm("Are you sure you want to delete this file: " + path + "?")) {
        return;
      }

      showMessage("Deleting file...", false);
      try {
        const res = await fetch("/delete?path=" + encodeURIComponent(path), {
          method: "DELETE"
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showMessage(data.message || "File deleted.", false);
          loadFiles();
        } else {
          showMessage("Delete failed: " + (data.error || "Unknown error"), true);
          alert("Delete failed: " + (data.error || "Unknown error"));
        }
      } catch (err) {
        showMessage("Error deleting file: " + err.message, true);
        alert("Error: " + err.message);
      }
    }

    // Initialize on page load
    checkStatus();
    loadFiles();
  </script>
</body>
</html>
