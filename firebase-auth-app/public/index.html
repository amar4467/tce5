<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Firebase Authentication</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Firebase App & Auth SDK (Compat UMD - works reliably in every browser) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="container">
    <!-- Login Card -->
    <div id="auth-container" class="card">
      <div class="header">
        <h2>Account Login</h2>
        <p>Enter your credentials to access your dashboard</p>
      </div>

      <!-- Alert / Status message -->
      <div id="status-message" class="status-box hidden"></div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" onsubmit="handleEmailLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="name@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" id="login-btn" class="btn primary-btn">Log In</button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <!-- Google Sign In Button -->
      <button type="button" id="google-btn" class="btn google-btn" onclick="handleGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707 0-.59.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
        </svg>
        <span id="google-btn-text">Continue with Google</span>
      </button>
    </div>

    <!-- Authenticated / Dashboard View -->
    <div id="user-dashboard" class="card hidden">
      <div class="header">
        <h2>Welcome Back!</h2>
        <p>You have successfully logged in.</p>
      </div>

      <div class="profile-card">
        <div class="avatar-container">
          <img id="user-avatar" src="" alt="Avatar" class="avatar hidden" />
          <div id="avatar-fallback" class="avatar-fallback">?</div>
        </div>
        <div class="user-details">
          <p><strong>Name:</strong> <span id="user-name">User</span></p>
          <p><strong>Email:</strong> <span id="user-email">Loading...</span></p>
          <p><strong>User ID:</strong> <span id="user-uid" class="code-span">Loading...</span></p>
          <p><strong>Sign-in Method:</strong> <span id="user-provider">Password</span></p>
        </div>
      </div>

      <button type="button" id="signout-btn" class="btn danger-btn" onclick="handleSignOut()">Log Out</button>
    </div>
  </div>

  <script>
    // 1. Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDcCKDcPhSEOl0MdLQwPe2PpwYE6M77VSM",
      authDomain: "cloud-firebase-d4e35.firebaseapp.com",
      projectId: "cloud-firebase-d4e35",
      storageBucket: "cloud-firebase-d4e35.firebasestorage.app",
      messagingSenderId: "782364844788",
      appId: "1:782364844788:web:295e7bbb0d5cc4e24034a1"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    // DOM Elements
    const authContainer = document.getElementById("auth-container");
    const userDashboard = document.getElementById("user-dashboard");
    const statusMessage = document.getElementById("status-message");
    const loginBtn = document.getElementById("login-btn");
    const googleBtn = document.getElementById("google-btn");
    const googleBtnText = document.getElementById("google-btn-text");

    const userAvatar = document.getElementById("user-avatar");
    const avatarFallback = document.getElementById("avatar-fallback");
    const userName = document.getElementById("user-name");
    const userEmail = document.getElementById("user-email");
    const userUid = document.getElementById("user-uid");
    const userProvider = document.getElementById("user-provider");

    function showMessage(text, type = "error") {
      statusMessage.textContent = text;
      statusMessage.className = "status-box " + type;
      statusMessage.classList.remove("hidden");
    }

    function clearMessage() {
      statusMessage.textContent = "";
      statusMessage.className = "status-box hidden";
    }

    // 2. Email / Password Login Handler
    window.handleEmailLogin = async function(event) {
      event.preventDefault();
      clearMessage();

      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        console.error("Login Error:", error);
        let msg = error.message;
        if (error.code === "auth/invalid-credential" || error.code === "auth/user-not-found" || error.code === "auth/wrong-password") {
          msg = "Invalid email or password. Please verify your credentials.";
        } else if (error.code === "auth/invalid-email") {
          msg = "The email address format is invalid.";
        }
        showMessage(msg, "error");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Log In";
      }
    };

    // 3. Google Sign-In Handler
    window.handleGoogleLogin = async function() {
      clearMessage();
      googleBtn.disabled = true;
      googleBtnText.textContent = "Connecting to Google...";

      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });

      try {
        await auth.signInWithPopup(provider);
      } catch (error) {
        console.error("Google Auth Error:", error);
        let errorMsg = error.message;

        if (error.code === "auth/operation-not-allowed") {
          errorMsg = "Google Sign-in is NOT enabled yet in your Firebase Console! Please go to Firebase Console > Authentication > Sign-in method and enable Google.";
        } else if (error.code === "auth/popup-blocked") {
          errorMsg = "Browser popup was blocked. Please allow popups for this site.";
        } else if (error.code === "auth/popup-closed-by-user") {
          errorMsg = "Google sign-in popup was closed before completing.";
        } else if (error.code === "auth/unauthorized-domain") {
          errorMsg = "This domain is not in the authorized domains list in Firebase Console.";
        }

        showMessage(errorMsg, "error");
        alert("Google Sign-In Alert: " + errorMsg);
      } finally {
        googleBtn.disabled = false;
        googleBtnText.textContent = "Continue with Google";
      }
    };

    // 4. Sign Out Handler
    window.handleSignOut = async function() {
      try {
        await auth.signOut();
      } catch (error) {
        alert("Error logging out: " + error.message);
      }
    };

    // 5. Auth State Listener
    auth.onAuthStateChanged((user) => {
      if (user) {
        authContainer.classList.add("hidden");
        userDashboard.classList.remove("hidden");

        userName.textContent = user.displayName || "User";
        userEmail.textContent = user.email || "No email available";
        userUid.textContent = user.uid;

        const providerId = user.providerData[0] ? user.providerData[0].providerId : "password";
        userProvider.textContent = providerId === "google.com" ? "Google" : "Email / Password";

        if (user.photoURL) {
          userAvatar.src = user.photoURL;
          userAvatar.classList.remove("hidden");
          avatarFallback.classList.add("hidden");
        } else {
          userAvatar.classList.add("hidden");
          avatarFallback.classList.remove("hidden");
          avatarFallback.textContent = (user.email ? user.email[0] : "U").toUpperCase();
        }
      } else {
        authContainer.classList.remove("hidden");
        userDashboard.classList.add("hidden");
        clearMessage();
      }
    });
  </script>
</body>
</html>
